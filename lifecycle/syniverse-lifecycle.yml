summary: >-
  Syniverse versions in the URI path and retires a major version by moving its
  documentation into an explicitly labelled deprecated section — the 10DLC v1 API
  still has a published Swagger definition under "API Version 1 (Deprecated)". What
  it does not publish is a written deprecation or sunset policy, an SLA, RFC 8594
  Deprecation/Sunset header support, or a public status page. status.syniverse.com
  does not resolve and /status on the corporate site is a 404; incident and uptime
  communication happens through the support portal and account teams, not a public
  status surface.
