- aid: syniverse:syniverse-access-token-management-api
  name: Syniverse SDC Application Access Token Management API
  description: >-
    Regenerates the access token associated with an SDC application via
    GET /saop-rest-data/v1/apptoken-refresh. This is the token-lifecycle piece of the Syniverse
    Developer Community bearer-token auth model. Confirmed live on 2026-07-25: both
    /saop-rest-data/v1/apptoken-refresh and the shorter /apptoken-refresh used by Syniverse's own
    example code answer on https://api.syniverse.com with
    {"errorCode":1,"moreInfo":"consumerkey parameter required","userMsg":"consumerkey"}.
  humanURL: https://sdcdocumentation.syniverse.com/index.php/developer-community-gateway-services/api-reference/explore-token-management-api-reference
  baseURL: https://api.syniverse.com
