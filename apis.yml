- aid: syniverse:syniverse-phone-number-verification-api
  name: Syniverse Phone Number Verification API
  description: >-
    Single-number lookup service that returns the current carrier, line type and status of a
    phone number so an enterprise can detect ported, deactivated, disconnected or reassigned
    numbers. Batch file lookup and proactive number monitoring are offered alongside it through
