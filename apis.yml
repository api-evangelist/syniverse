  name: Syniverse Omni-Channel Messaging API (SCG)
  description: >-
    The Syniverse Communication Gateway (SCG) API — the core of the Syniverse Developer Community
    platform. 72 documented paths and 148 operations covering message requests, messages,
    scheduled messages, message templates, sender IDs, channels, contacts and contact groups,
    attachments, keywords, calls, bridges, conferences and application instances, for SMS, MMS,
    RCS, Facebook Messenger, WeChat, WhatsApp, push and voice.
