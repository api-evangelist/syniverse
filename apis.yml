- aid: syniverse:syniverse-account-takeover-detection-api
  name: Syniverse Account Takeover Detection API
  description: >-
    A single POST /v1/simCheck operation that reports whether an end user's mobile channel has had
    recent SIM changes or call forwarding enabled, as an account-takeover risk signal. Functionally
    adjacent to CAMARA SIM Swap but published as Syniverse's own definition, on a sandbox host,
    with no CAMARA schema or naming.
  humanURL: https://sdcdocumentation.syniverse.com/index.php/account-takeover-detection/getting-started/account-takeover-detection-overview
  baseURL: https://mobileidsandbox.syniverse.com/cigateway/id
