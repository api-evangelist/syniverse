- aid: syniverse:syniverse-right-party-verification-api
  name: Syniverse Right Party Verification API
  description: >-
    A single POST /v2/match operation that returns match scores comparing an end user's asserted
    identity against Syniverse-sourced mobile data. This is Syniverse's own identity-matching API,
    not the CAMARA KYC Match specification. The published definition points at a sandbox host.
  humanURL: https://sdcdocumentation.syniverse.com/index.php/right-party-verification/getting-started/right-party-verification-overview
  baseURL: https://mobileidsandbox.syniverse.com/cigateway/id
