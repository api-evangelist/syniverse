aid: syniverse
url: https://raw.githubusercontent.com/api-evangelist/syniverse/refs/heads/main/apis.yml
name: Syniverse
kind: company
description: >-
  Syniverse is a United States headquartered wholesale telecommunications company that sits
  between mobile network operators rather than in front of consumers. Its mobility business runs
  inter-carrier roaming, IPX network and signaling, 5G SEPP, clearing and settlement, global SIM
  and satellite roaming for carriers, and none of that carrier-side estate is exposed as a public
  API. Its messaging business is the opposite: an A2P/CPaaS aggregator selling SMS, MMS, RCS,
  WhatsApp, push, voice, 10DLC campaign registration, messaging trust/anti-spam and mobile
  identity services to enterprises, and it is published through a genuine self-serve developer
  portal, the Syniverse Developer Community (SDC), where anyone can sign up for a free API key,
  read the docs, and download eleven Redoc-rendered OpenAPI/Swagger definitions. On network APIs
  Syniverse is a channel, not a source — it joined GSMA Open Gateway in April 2025 as a channel
  partner and announced an integration with Aduna in June 2025, but no CAMARA-defined API is
  documented or callable on its developer portal today.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Telecommunications
- United States
- CPaaS
- Messaging
- SMS
- Roaming
- IPX
- Wholesale
- Identity Verification
- SIM Swap
- 10DLC
- Open Gateway
- Network APIs
- Aggregator
