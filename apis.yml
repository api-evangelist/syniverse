- aid: syniverse:syniverse-event-subscription-service-api
  name: Syniverse Event Subscription Service API (Event Manager)
  description: >-
    The webhook and event layer of the Syniverse Developer Community. The Event Subscription Service (ESS)
    API manages topics, topic-subscriptions, delivery-configurations, event-types, event-deliveries, event-delivery-attempts
    and event-buffer-files, driving scheduled or near-real-time REST delivery of message delivery receipts
    and phone-number status change events to a customer endpoint, with None, Basic Auth or OAuth 2.0 on
    the receiving side. Documented as a rendered RAML console; no downloadable machine-readable definition
    was found.
