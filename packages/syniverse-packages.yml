summary: >-
  Syniverse ships first-party client libraries for the Syniverse Communication
  Gateway (SCG) messaging API, but the registry-published surface is much smaller
  than the GitHub surface. Only the Java/Android SDKs are published to Maven
  Central under the com.syniverse.sdk group, and only the Cordova push plugin is
  published to npm under the @syniverse scope. Every other language binding
  (Python, PHP, Ruby, C#, C++, Objective-C) is source-only on GitHub with no
  registry artifact. Nothing is published to PyPI, RubyGems, Packagist or NuGet.
  The published libraries are old — the newest Maven artifact dates to 2021 and
  the newest npm release to 2017 — while the OpenAPI definitions they wrap carry
  2025 and 2026 revision dates, so the SDK layer trails the contract layer.
