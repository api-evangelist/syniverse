  camara:
    posture: >-
      GSMA Open Gateway CHANNEL PARTNER plus an announced Aduna integration — press-release
      posture only. Nothing CAMARA-shaped is documented or callable on the Syniverse Developer
      Community today.
    apisWithRealEvidence: []
    apisNamedInAnnouncementsOnly:
    - Number Verification
    - SIM Swap
    - Device Location
    - Quality on Demand
    detail: |
      Syniverse is not a mobile network operator, so it is not a CAMARA API source. It reaches
      network APIs as a channel:

      1. On 2025-04-29 Syniverse announced it had joined the GSMA Open Gateway initiative as
         "one of Open Gateway's newest channel partners", naming device location, SIM swap
         detection, number verification and quality on demand as the capabilities enterprises
         can reach through the initiative.
         Source: https://www.syniverse.com/news/syniverse-joins-gsma-open-gateway-to-expand-enterprise-access-to-mobile
      2. On 2025-06-18 Syniverse and Aduna — the Ericsson-and-carrier joint venture that
         aggregates CAMARA APIs commercially — announced Syniverse would integrate with Aduna's
         unified API platform, naming SIM Swap, Number Verification and Device Location. The
         wording is forward-looking ("seeks to offer", "will broaden the reach") with no GA date.
         Source: https://adunaglobal.com/resources/news-syniverse-to-team-up-with-aduna-to-expand-access-to-network-apis/

      A press release is not an implementation. As of 2026-07-25 there is no CAMARA API on the
      SDC portal: no CAMARA-named product page, no CAMARA OpenAPI in the documentation, no
      /camara path, opengateway.syniverse.com does not resolve, and /opengateway on the corporate
      site is a 404. Grepping all eleven harvested specs for "camara", "CIBA", "backchannel",
      "open gateway", "sim swap", "number verification", "device location" and "quality on
      demand" returned zero matches.

      What Syniverse does ship is its own functionally adjacent identity family, published years
      before CAMARA and structured nothing like it: Account Takeover Detection (POST /v1/simCheck,
      a SIM-swap-adjacent risk signal), Right Party Verification (POST /v2/match, KYC-match
      adjacent) and Phone Number Verification (POST /lookup, number status/porting). These are
      Syniverse-proprietary contracts on Syniverse hosts, not CAMARA specifications.
    openGatewayMember: true
    openGatewayRole: channel partner (not an operator; Syniverse has no mobile network of its own)
    adunaChannel: announced 2025-06-18, integration not evidenced as live
  tmForum:
    conformanceFound: false
    note: >-
      No TM Forum Open API conformance certification for Syniverse was found in this review, and
      no TMF-numbered API (TMF620, TMF622, TMF641 or otherwise) appears anywhere in the public
      documentation or in the eleven harvested specs. Syniverse's BSS-adjacent products
      (clearing and settlement, billing and charging evolution, mobile profile management) are
      sold as carrier services, not as certified TM Forum interfaces.
  threeGPP:
    nefOrScefSurface: false
    note: >-
      Syniverse operates IPX, signaling, 5G SEPP (Security Edge Protection Proxy) and 5G roaming
      for satellite as carrier infrastructure products, all described on www.syniverse.com/mobility/
      as sales-led solutions. No NEF or SCEF exposure endpoint, no network-slicing API and no
      edge/MEC API is publicly documented.
  auth:
    model: Bearer access token issued per registered SDC application
    detail: |
      The dominant scheme across the SCG, 10DLC and identity APIs is an SDC application access
      token presented as "Authorization: Bearer {token}". The 10DLC v2.3 spec declares it as
      http/bearer with bearerFormat "SDC"; the deprecated 10DLC v1 spec declares it as an apiKey
      in the Authorization header with the literal description "Use Bearer {Syniverse SDC
      Application Token}". Phone Number Verification declares http/bearer with bearerFormat JWT.
      Token lifecycle is itself an API: GET /saop-rest-data/v1/apptoken-refresh regenerates an
      application's access token.
    oauth2: |
      True OAuth2 client-credentials appears only on the Messaging Trust family, with tokenUrl
      https://api.mt1.messaging-trust.syniverse.com/oauth2/token and empty declared scopes. The
      Whitelisting Service spec declares a legacy OAuth2 implicit flow against
      https://beta.api.syniverse.com/token. The Event Manager can also act as an OAuth2 client
      against the customer's own endpoint (client_credentials, password or refresh_token) when
      delivering events outbound.
    ciba: false
    cibaNote: >-
      CIBA (Client-Initiated Backchannel Authentication), which CAMARA specifies for
      network-based authorization, does NOT appear anywhere — not in any of the eleven specs, not
      in the documentation. Consistent with a provider that channels network APIs rather than
      terminating them.
    wellKnown: >-
      Neither /.well-known/openid-configuration nor /.well-known/oauth-authorization-server is
      served on api.syniverse.com (both HTTP 404). No OIDC discovery document was found.
