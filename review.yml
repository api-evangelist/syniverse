    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://mobileidsandbox.syniverse.com/cigateway/id
    documented: true
    note: Sandbox host as published in the RPV and ATO definitions.
  - protocol: Webhook
    scheme: https
    documented: true
    note: Outbound near-real-time REST event delivery via Event Manager.
  - protocol: WebSocket
