aid: syniverse
name: Syniverse
review:
  question: Does Syniverse publish a real, self-serve public developer surface, and what is its CAMARA / GSMA Open Gateway posture?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: wholesale-messaging
  gated: false
findings:
  summary: |
    Syniverse is split down the middle, and both halves are visible from the outside.

    Its mobility business — inter-carrier roaming, IPX network and signaling, 5G SEPP,
    clearing and settlement, global SIM, satellite roaming, mobile policy control — is
    carrier-facing and sales-led. Nothing in it is documented as a public API; every path
    into it ends at a contact-sales form.

    Its messaging business is the opposite and is genuinely API-native. The Syniverse
    Developer Community (SDC) at https://developer.syniverse.com/ (HTTP 200) is a real
    self-serve developer portal, not a login wall and not a marketing page: it advertises
    "GET YOUR FREE API KEY", offers signup, and the quickstart hands you a working public
    US test channel ID and a curl command against a live gateway. Product documentation
    lives on a second host, https://sdcdocumentation.syniverse.com/ (HTTP 200), which
    renders eleven downloadable OpenAPI/Swagger definitions through Redoc. The API gateway
    itself is live and enforcing auth — an anonymous GET to
    https://api.syniverse.com/scg-external-api/api/v1/messaging/message_requests returned
    HTTP 401.

    One caveat on portal probing: developer.syniverse.com is an AngularJS single-page app
    with a catch-all route, so arbitrary paths (including /openapi.json and /swagger.json)
    return HTTP 200 with the SPA HTML shell. Only the root and the documentation host carry
    real content. No spec is served from developer.syniverse.com itself.
  developerPortal:
    url: https://developer.syniverse.com/
    status: 200
    real: true
    note: >-
      Genuine self-serve portal. Free API key, self-signup, public test channel, trial account
      with number whitelisting. Postpaid accounts require a Syniverse representative, but nothing
      blocks a developer from reading docs, signing up, and calling the API.
    loginURL: https://developer.syniverse.com/sdc-ui/applications
  documentationHost:
    url: https://sdcdocumentation.syniverse.com/
    status: 200
    platform: concrete5 8.5.4, Redoc for OpenAPI rendering, RAML console for the Event Manager API
