summary: >-
  Syniverse serves no /.well-known/ discovery surface. Every RFC 9116 security.txt,
  OIDC discovery, RFC 8414 authorization-server metadata, RFC 9728 protected-resource
  metadata, RFC 9727 api-catalog and ai-plugin.json probe missed on every host. Two
  hosts answer 200 for all paths but are false positives: developer.syniverse.com is
  an AngularJS single-page app with a catch-all route that returns the SPA HTML shell
  for any path, so its 200s carry no document. The Messaging Trust host published in
  the Messaging Trust OpenAPI definitions does not resolve in public DNS at all.
