summary: >-
  The Syniverse Communication Gateway data model has three clusters that meet at the
  Sender ID. Messaging is a two-level send model — a Message Request fans out into
  one Message per recipient — decorated by Channels, Templates, Attachments and
  Keywords. Contacts are a first-class CRM-ish cluster (Contact, Contact Group,
  consent/address status, access tokens, fast-access rules) that messaging targets.
  Voice is a parallel cluster (Call, Bridge, Conference, Conference Member, Digits
  Collector). Everything hangs off an Application, which is the credential and
  entitlement boundary. 10DLC campaign registration is a separate service whose
  Campaign owns Longcodes and Number Pools, and it is joined to messaging only
  loosely through the campaign_id carried on Messages and Keywords.
