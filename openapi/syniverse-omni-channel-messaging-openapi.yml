  /consent/contact_address_statuses:
    get:
      tags:
      - Contact Address Status
      summary: Retrieve Contact Address Statues
      description: '  Retrieve Contact Address Statues'
      parameters:
      - name: id
        in: query
        description: |
          Unique identifier, allocated by SCG at the time of address creation. This is a combination of an address type/value and sender id.
          SCG will allocate a new address_status_id for any message sent or received from a new combination of sender id and address value/type
        required: false
        type: string
      - name: address_type
        in: query
        description: |
          The address type: MDN (for phone numbers), EMAIL, SOCIAL, PUSH (...)
        required: false
        type: string
      - name: address
        in: query
        description: |
          The actual value of the address. For SMS/MMS this will be the MDN.
        required: false
        type: string
      - name: sender_id
        in: query
        description: |
          the sender id accociated with the address type/value
        required: false
        type: string
      - name: consent_status
        in: query
        description: |
          this is the current optin status for the specific address / sender id. The possible values are:
          - NONE (no optin or optout message received from the address on the specific sender id)
          - OPTIN (user has explicitly opted in to the sender id)
          - OPTOUT (user has explicitly opted out of the sender id)
          - BLACKLIST (blacklisted address - will be treated as explicit OPTOUT)
          - WHITELIST (whitelisted address - will be treated as explicit OPTIN)
          NOTE: Whitelisted or blacklisted status can not be overwritten by the end-user by sending messages to the sender id. Such users can be only un-listed by changing the optin-status explicitly put POST to address status ID
        required: false
        type: string
      - name: application_id
        in: query
        description: |
          ID of the application that has created the resource
        required: false
        type: integer
      - name: created_date
        in: query
        description: |
