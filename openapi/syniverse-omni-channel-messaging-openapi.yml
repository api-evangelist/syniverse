        description: |
          Number of messages where translations was attempted but failed.
      translations_performed_count:
        type: integer
        description: |
          Number of actual translate requests sent to the translation engine. This is the billable number of translations.
      content_type:
        type: string
        description: |
          The content type of the message request body.
      options:
        type: string
        description: |
          json options in use with push notifications
      created_date:
        type: string
        description: |
          For a MT sent via this API, this indicates the time when the API was called to request message delivery.  For a MO message, this is the point in time when the SCG was notified of the inbound message from the operator network/mediate channel.
      last_updated_date:
        type: string
        description: |
          Timestamp of the last event associated with the message
      version_number:
        type: integer
        description: "An ascending version number of the object.  1 upon creation, incremented by one for each modification done.  \nNOTE: unlike other resources in the messaging gateway, messages are not updated directly. Events happening to a message (sending, delivery receipts, replies, conversions ...) indirectly update the status and hence version number of the message.\n"
