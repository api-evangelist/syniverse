    type: object
    properties:
      name:
        type: string
        description: |
          name of the keyword
      description:
        type: string
        description: |
          description of the keyword
      value:
        type: string
        description: |
          the keyword. For example 'SPORTS'. The keyword can be expressed in form of a regular expression. POSIX Extended syntax is supported.
      case:
        type: string
        description: |
          SENSITIVE/INSENSITIVE specifies whether the keyword is case sensitive or not. default is not case sensitive.
      sender_id:
        type: string
        description: |
          The sender id on which the keyword is valid. When this is empty, any sender id associated with the given customer will be sensitive to this keyword
      valid_from:
        type: string
        description: |
          the date range for which the keyword is valid
      valid_to:
        type: string
        description: |
          the date range for which the keyword is valid
      associated_info:
        type: string
        description: |
          additional information, value is at customer discretion, this attribute is added to the keyword event whenever the keyword is detected
      campaign_id:
        type: string
        description: |
          The campaign id
      type:
        type: string
        description: |
          the type of the keyword:
          - RESERVED: those are the platform specific keywords that can not be used by customer in any campaign. Those keywords will always exist, the company will never need to add them
          - COMPANY: company specific keywords
      actions:
        type: string
        description: |
          actions to be applied when the keyword has been received. Multiple actions can be specified. The various actions should be separated by a coma or space:
          - OPTOUT -> mark the user as explicitly opted out (and forward message to Consent Manager)
          - OPTIN > mark the user as explicitly opted in (and forward message to Consent Manager)
          - STORE -> no action, just record in user profile
