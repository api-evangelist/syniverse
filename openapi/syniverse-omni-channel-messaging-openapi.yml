  inline_response_200_6_list:
    type: object
    properties:
      id:
        type: string
        description: |
          Unique identifier
      message_request_id:
        type: string
        description: |
          The unique id of the associated message request resource.
      external_message_request_id:
        type: string
        description: |
          Application provided unique tracking ID for the message.   Can be used as an alternative key in query methods.
      conversation_id:
        type: string
        description: |
          The identifier of the conversation for conversation threading.
      campaign_id:
        type: string
        description: |
          The campaign id: A unique identifier for a particular messaging campaign or program
      direction:
        type: string
        description: |
          Message direction: MO for received messages and MT sent messages
      customer_sender_id:
        type: string
        description: |
          The sender_id associated with the message delivery channel. For MT messages this will be the sender_id used to deliver the message. For MO messages this will be the sender_id corresponding to the downstream system which generated the message (determined by SCG based on the from/to address accordingly)
      from_address:
        type: string
        description: |
          The sender address.
      to_address:
        type: string
        description: |
          The recipient address.
      state:
        type: string
        description: "The status of the message to this recipient.  \nValid values for MT messages are:\n- CREATED (message was created and is in the queue of SCG)\n- SENT (message was sent to the outbound delivery system)\n- DELIVERED (message was delivered to end-device of the user)\n- READ (message was read by the user)\n- CONVERTED (message was converted i.e. end user took action upon message)\n- FAILED (message delivery failed)\n- EXPIRED (message was too old to be sent)\n- SCHEDULED (message is created but not submitted for sending)\n- TEST (message was created but the request was a test request)\n- PAUSED (message was created but the request was to pause before delivery)\n- DELETED \nSCG will automatically set the status of the message to converted when the message contains a 'tracked' URL and the link was clicked by the recipient.\nAlternatively the customer also externally can track conversion and could update the message status put applying the PUT method and specifying status = CONVERTED and the conversion timestamp\nValid values for MO Messages are:\n- RECEIVED (received at SCG)\n- PROCESSED (when the customer has accessed the message and updated the status)\n- DELETED (when the message was deleted by the customer)\n"
      failure_code:
        type: string
        description: |
          INVALID_RECIPIENT, NO_CONSENT, OTHER
      failure_details:
        type: string
        description: |
          text description that gives more detail on failed messages
      subject:
        type: string
        description: |
          Subject of the message.
      body:
        type: string
        description: |
          The message body as sent to the recipient.
      sent_date:
        type: string
        description: |
          The timestamp when the message was submitted to downstream system for delivery
      delivered_date:
        type: string
        description: |
          The timestamp when the message has been delivered, corresponds to DR date.
      converted_date:
        type: string
        description: |
          The timestamp when the message was converted. This will be set automatically by SCG for messages with link tracking. For external tracking, the customer must provide the converted timestamp
      reply_to:
        type: string
        description: |
          The Message ID of a previously delivered message which the current message is a reply to.
      attachments:
        type: array
        items:
          type: string
      scheduled_delivery_time:
        type: string
        description: |
          The date and time that this message should be delivered. This is the user specific time as calculated by the SCG based on the destination time zone and requested time zone calculation.
      expiry_time:
        type: string
        description: |
          This is the timestamp after which the messages will no Integer be sent to the downstream system for delivery
      type:
        type: string
        description: |
          The message type (SMS, MMS, PSH, FB)
      contact_id:
        type: string
        description: |
          The ID of the contact (if any) this message was sent to
      price:
        type: number
        description: |
          The message cost.
      application_id:
        type: integer
        description: |
          ID of the application that has created the resource
      created_date:
        type: string
        description: |
          The timestamp when the message was created, which corresponds to the time when the bulk message POST was done by the client.
      language:
        type: string
        description: |
          Language this message was translated to
      failedTranslation:
        type: string
        description: |
          The reason that translate failed for this message
      last_updated_date:
        type: string
        description: |
          The data the resource was last changed
      version_number:
        type: integer
        description: |
          An ascending version number of the resource.  1 upon creation, incremented by one for each modification done.  Used to implement optimistic locking
      request_body:
        type: string
        description: |
          This is the body of the message as supplied by the customer's application.  It can reference a message template and supply the variables assignments for use with a template or contain the actual message body
      external_id:
        type: string
        description: |
          Application provided unique tracking ID for the message.   Can be used as an alternative key in query methods.
      contact_delivery_address_priority:
        type: string
        description: |
          Priority list of contact delivery addresses (MDN, PUSH)
      failover:
        type: string
        description: "Controls fail over to SMS in case of MMS, RCS and OTT message delivery failures. \nValid value: SMS\n"
      verify_number:
        type: boolean
        description: |
          If this flag is set to 'true' then the recipient phone numbers will be checked to ensure they are valid mobile numbers,  virtual mobile numbers or virtual landline numbers.
      verify_sms:
        type: boolean
        description: |
          If this flag is set to 'true' then the message content  and the sender of the message will be verified via the  Google messages application. If the verification is  successful, the end-user will be shown a transcript  stating that the message was verified along with  the customer's logo in the Google messages application.
      options:
        type: string
        description: |
          json options in use with push notifications
      sender_id_sort_criteria:
        type: string
        description: |
          Priority list of SenderId selection criteria (DELIVERY_ADDRESS, PRICE)
      from:
        type: string
        description: "The from attribute is the channel Id or Sender Id over/from which the message is to be sent.\n-To send from a sender ID, the ID should be prefixed with 'sender_id:'.   \n-To send from a channel the ID should be prefixed with 'channel:'.\n"
      pause_before_transmit:
        type: boolean
        description: |
          This is a flag that tells SCG to generate the messages but not to deliver them.
      pause_expiry_time:
        type: string
        description: |
          This is the timestamp after which all paused messages will expire and will be removed from the outbound queue. The maximum expiry time is 24h. If application creates a message request with Integer pause expiry time, the message request will fail
      price_threshold:
        type: integer
        description: |
          The price threshold for messages in a request
      to:
        type: string
        description: |
          Recipient address or contact id.
      src_language:
        type: string
        description: |
          This is the source language of a message. The defauly is English 'en'
      dst_language:
        type: string
        description: |
          Translate message to a specified language. If not set,  only messages to contacts with language preference will be translated.
      translate:
        type: boolean
        description: |
          When translate attribute is set to 'true' translation of message body is enabled.
      consent_requirement:
        type: string
        description: |
          This field indicates if the message delivery is dependent on the consent status for the message recipient. This field is specific to a Sender address (Shortcode) that is classified as 'User Managed' consent.  This is meant for Businesses who are responsible for managing consent but use the SCG contacts database to store the consent status for message recipients. Any contacts/destination MDNs for end-users that a message is sent to but does not have an opt-in status associated with the sender address will be blocked (message will be created but will be in 'failed' status and will not be sent to the recipient).  Supported values are:
          - OPT_IN (message will be sent only if user explicitly opted in)
          - OPT_OUT (message will be sent unless user explicitly opted out)
          - NONE (message will be sent irrespectively of optin status)
      channel_id:
        type: string
        description: |
          The channel id
      destination_country:
        type: string
        description: |
          destination country
      body_extensions:
        type: string
        description: |
          Extended body
      content_type:
        type: string
        description: |
          The content type of the message request body.
      sender_id_alias:
        type: string
        description: |
          alias of the sender
      protocol_error:
        type: string
        description: |
          The protocol level error that caused the message to fail
      fragment_count:
        type: integer
        description: |
          fragment count
      fragments_info:
        type: array
        items:
          type: string
      media_urls:
        type: array
        items:
          type: string
      mediaURL_attachIds:
        type: array
        items:
          type: string
      number_type:
        type: string
        description: |
          type of a number
      group_to:
        type: array
        items:
          type: string
      shortcode_address_type:
        type: string
        description: |
          shortcode address type (STANDARD, FTEU)
      standalone:
        type: boolean
        description: |
          standalone: true or false
      failover_reference:
        type: string
        description: |
          The failover info
      test_message_flag:
        type: boolean
        description: |
          This is a test mode flag for performing basic functional tests. If this flag is set to 'true' then this will be processed and Out bound messages will be created but the messages will not be delivered to a handset.
      recipient_verifiedSms_enabled:
        type: boolean
        description: |
          recipient verified sms enabled: true or false
