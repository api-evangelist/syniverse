      address_list:
        type: string
        description: |
          Stores all known addresses of the customer in a form of a JSON array. Each address in the array can have the following attributes:
          - priority: priority of the address, 1 highest
          - designation: specifies type of the address: home, work
          - use: billing, shipping
          - source: specifies where the address comes from, company specific
          - status: status of the address: VALID_NEW, VALID_CONF, INVALID, EXPIRED
          - line1: first address line
          - line2: second address line
          - city
          - state
          - province
          - zip
          - country
      account_list:
        type: string
        description: |
          Stores all known accounts of the customer in a form of a JSON array. Each account in the array can have the following attributes:
          - priority: user defined account priority
          - designation:  primary designation of the account: work, private ...
          - source: specifies where the address comes from, company specific
          - status: status of the address: VALID_NEW, VALID_CONF, INVALID, EXPIRED
          - type: email, social, web, loyalty
          - username: the username in the account. This will be the membership id in loyalty programs or the email address for an email account
          - domain: account domain. For example starwood.com
          - access_token: the access token to the account where the account requires some oauth type authorization
          NOTE: other attributes may be required/provided, based on the account type and domain.
      device_list:
        type: string
        description: "Stores all known customer devices in a form of a JSON array. Each account in the device can have the following attributes:\n- priority: user defined account priority\n- designation:  primary designation of the account: work, private ...\n- source: specifies where the address comes from, company specific\n- status: status of the address: VALID_NEW, VALID_CONF, INVALID, EXPIRED\n- msisdn\n- carrier\n- mac_address, \n- uuid\n- imei \n- manufacturer: device manufacturer, for example Apple\n- model: model of the device, for example iPhone 5s\n- os: operating system of the device, for example iOS 8.3\nNOTE: other attributes may be required/provided, based on the device type.\n"
      interest_list:
        type: string
        description: "Stores all known customer preferences in a form of a JSON array. Each preference can have the following attributes:\n- code: interest code \n- name: interest name\n- source: where the information was obtained\n- score: how likely the information is, floating point value 0...1\n"
      demographic_list:
        type: string
        description: |
          Stores all known customer demographic in a form of a JSON array. Each demographic can have the following attributes:
          - demographic name
          - source: where the information was obtained
          - score: how likely the information is, floating point value 0...1
      extended_attributes:
        type: string
        description: |
          JSON string of all extended attributes of the customer. Any list of key:value pairs is supported. Also composite attributes can be stored.
      preferred_language:
        type: string
        description: |
          When translation is enabled, the message to this contact will be translated
      voice_preference:
        type: boolean
        description: "This contacts preference setting for voice message delivery: \n- NONE : no preference\n- PREFER_VOICE : contact prefers voice if possible (voice capable sender ID available as message originator and is not rejected due to price or other policy)\n- REQUIRE_VOICE : contact requires voice - selecting voice capable sender ID overrides price and other policies; message fails if voice sender ID is not available\n"
      social_handles:
        type: string
        description: |
          list of social handles
      social_profile_lookup_prefix:
        type: string
        description: |
          which social id to use to update contact info
      social_profile_lookup_override:
        type: boolean
        description: |
          If set to true will overwrite existing contact attributes that are collected from social id
