      consent_managed_by:
        type: string
        description: |
          Possible values: USER, SCG or SCG_UNSOLICITED_OPT_OUT. Default is USER
      capabilities:
        type: array
        description: |
          Message types allowed on the sender ids from of this type: SMS, MMS, VOICE, WhatsApp etc.
        items:
          type: string
      check_white_list:
        type: boolean
        description: |
          If set, sending via this sender ID is limited to recipients present in the customer's white list.
      register_number:
        type: string
        description: |
          When the 'register_number' can be set to 'true' or 'false'. When set to 'true', this instructs SCG to register a Telephone number with the appropriate Operator or Registration entity.
      register_method:
        type: string
        description: |
          Provides registration method for sender ids that need registration step - currently WhatsApp sender ids.

          Values:

           * voice - deliver verification code via phone call
           * sms -  deliver verification code via SMS
      verification_code:
        type: string
        description: |
          Provides verification code for sender ids that need verification step - currently WhatsApp sender ids.
