definitions:
  inline_response_200_34:
    type: object
    properties:
      id:
        type: string
        description: |
          The unique job id.
      query:
        type: string
        description: |
          The JSON query string for this job.
      ignore_case:
        type: boolean
        description: |
          ignore case in the query
      offset:
        type: integer
        description: |
          Delete only resources that occur after this offset.
      limit:
        type: integer
        description: |
          The maximum number of the
      delete_resource:
        type: string
        description: |
          Resource to be deleted.
          Allowed values are:
          - MESSAGES
          - MESSAGE_REQUESTS
          - ATTACHMENTS
          - CONTACTS
  Digits_Collector:
    type: object
    required:
    - prompt
    properties:
      max_digits:
        type: string
        description: |
          will stop collecting digits when max_digits is reached
      timeout:
        type: integer
        description: |
          will stop collecting if timeout is reached
      terminating_digits:
        type: string
        description: |
          Will stop if some of terminating_digits  is  pressed
      prompt:
        $ref: '#/definitions/digit_collector_prompt'
  digit_collector_prompt:
    type: object
    required:
    - sentence
    properties:
      sentence:
        type: string
        description: |
          sentence to speak in the prompt
      voice:
        type: string
        description: |
          voice to speak the senttence
      gender:
        type: string
        description: |
          gender of the voice
      locale:
        type: string
        description: |
          language locale of the voice
  inline_response_200_31:
    type: object
    properties:
      list:
        type: array
        items:
          $ref: '#/definitions/inline_response_200_31_list'
  inline_response_200_30:
    type: object
    properties:
      list:
        type: array
        items:
          $ref: '#/definitions/inline_response_200_30_list'
  Sender_ID_Message_Template_2:
    type: object
    properties:
      designation:
        type: string
        description: |
          The template is used either for VALIDATOR or as an actual TEMPLATE.
          VALIDATOR type templates will be associated with a sender id and any message that is submitted to a sender ID that has some VALIDATOR templates associated with it will be checked against the template.
          TEMPLATE type templates are used to send messages. in such case the message request body will indicate with template to apply and the message processing will use the template body and apply conversion of applicable keywords to create the actual message body.
          NOTE: validator type templates can not be modified by the customer where the message template is associated with a shared sender id
      name:
        type: string
        description: |
          The name of the template.
      pattern:
        type: string
        description: |
          template pattern can be used to enforce compliancy of the message body with the submitted program brief. The template pattern allows also to use the templates to form the message body by using the template pattern and replacing the keywords in the pattern with the values of submitted keywords in the message send from the sender id
      version_number:
        type: integer
        description: |
          An ascending version number of the resource.  1 upon creation, incremented by one for each modification done.  Used to implement optimistic locking
  Report Job:
    type: object
    properties:
      query:
        type: string
        description: |
          The JSON query string for this report.
      fileds:
        type: string
        description: |
          A list of field names to be included in the report.
      sort:
        type: string
        description: |
          The sort parameters to be used.
      report_type:
        type: string
        description: |
          The type of the report.  Can be:
          - MESSAGES
          - CONTACTS
  Conference:
    type: object
    required:
    - from
    properties:
      external_id:
        type: string
        description: |
          The unique Id assigned by the application.
      from:
        type: string
        description: |
          The calling party's address.
  inline_response_200_16_list:
    type: object
    properties:
      id:
        type: string
        description: |
          Unique identifier, allocated by SCG at the time of contact creation
      external_id:
        type: string
        description: |
          the id of the contact at the customer system. Can be used by customer to update the contacts
      first_name:
        type: string
        description: |
          First name of customer
      last_name:
        type: string
        description: |
          Last name of customer
      birth_date:
        type: string
        description: |
          Customer birth date. YYYY-MM-DD
      first_acquisition_date:
        type: string
        description: |
          The timestamp of the first customer acquisition - i.e. the date when the customer has been for the first time opted in to any program
      last_acquisition_date:
        type: string
        description: |
          The timestamp of the last customer acquisition i.e. the date when the customer has for the last time sent an optin keyword or performed a doubleoptin
