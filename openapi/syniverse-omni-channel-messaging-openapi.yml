        description: |
          This is the body of the message as supplied by the customer's application.  It can reference a message template and supply the variables assignments for use with a template or contain the actual message body
      body_extensions:
        type: string
        description: |
          Extended body
      message_type:
        type: string
        description: "Type of message: \n - SMS\n - MMS\n - PSH\n - VOICE\n - FACEBOOK\n - WECHAT\n - WHATSAPP\n - RCS\n - EMAIL\n - VIBER\n"
      response_description:
        type: string
        description: |
          Response info
      attachments:
        type: array
        items:
          type: string
      media_urls:
        type: array
        items:
          type: string
      mediaURL_attachIds:
        type: array
        items:
          type: string
      group_mms:
        type: boolean
        description: |
          Group mms: true or false
      subject:
        type: string
        description: |
          The subject - a short summary of the message's purpose.
      application_id:
        type: string
        description: |
          ID of the application that has created the message request
      external_id:
        type: string
        description: |
          Application provided unique tracking ID for the message.   Can be used as an alternative key in query methods.
      state:
        type: string
        description: |
          The status of the message request:
          - SUBMITTED
          - ACCEPTED
          - REJECTED
          - PREPARING (while in the preparing state, the recipient cont may increase with time i.e. SCG will keep track of the preparing step to allow polling on the resource to have user see progress)
          - TRANSMITTING (while in the transmission state, the sent count will be updates as the messages are being sent)
          - COMPLETED
          - PAUSED (SCG will go into this state after preparing if pause flag is set)
          - CANCELED  (cancel can be requested at any time)
          NOTE: to resume paused messages, the status should be updated by customer from PAUSED to TRANSMITTING
      verify_sms:
        type: boolean
        description: |
          If this flag is set to 'true' then the message content  and the sender of the message will be verified via the  Google messages application. If the verification is  successful, the end-user will be shown a transcript  stating that the message was verified along with  the customer's logo in the Google messages application.
      sent_count:
        type: integer
        description: |
          The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.
      delivered_count:
        type: integer
        description: |
          The number of messages sent for which some form of delivery receipt confirmation has been received. The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.
      read_count:
        type: integer
        description: |
          The number of messages sent for which some form of delivery receipt confirmation has been received. The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.
      converted_count:
        type: integer
        description: |
          The number of messages where conversion has been confirmed. This will apply for messages with URL where the application requested a link track. The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.
      canceled_count:
        type: integer
        description: |
          The number of messages that have been created but not sent because the message request was canceled
      failed_count:
        type: integer
        description: |
          The number of messages that have expired or have failed delivery
      scheduled_delivery_time:
        type: string
        description: |
          The date and time that this message should be delivered.  The following formats are supported:
          - Unix Epoch time in milliseconds (e.g. 1527966000000)
          - yyyy-MM-dd'T'HH:mm:ss (e.g. 2018-05-24T18:50:00) Note: Defaults to UTC.
          - yyyy-MM-dd'T'HH:mm:ssZ (e.g. 2018-05-24T18:50:00Z)
          - yyyy-MM-dd'T'HH:mm:ss.SSSZ (e.g. 2018-05-24T18:50:00Z)
          - EEE, dd MMM yyyy HH:mm:ss zzz (e.g. Thursday, 24 May 2018 19:20:00 PST)
          - yyyy-MM-dd (e.g. 2018-05-24). Will be scheduled for 12am UTC on the date specified.
      scheduled_delivery_time_zone:
        type: string
        description: |
          Determines what time zone to apply to the scheduled delivery time:
          - UTC  - If no timezone was supplied in the delivery time then UTC is used.
          - LOCAL -  means that the scheduled delivery time as supplied in the request is expressed in LOCAL recipient time. The time zone of the recipient is determined by SCG automatically based on the primary_address_zip value in the recipient contact record.  The UTC time of day of the supplied scheduled_delivery_time will be used to deliver to the recipient at the same time of day in the local timezone.  For example, if the supplied scheduled delivery time is May 24th at 11:00am UTC, then the message would be delivered to someone with a zipcode in the Pacific timezone at  May 24th at 11:00am PDT.
      expiry_time:
        type: string
        description: |
          This is the timestamp after which the messages resulting from the message request should no Integer be sent.
      test_message_flag:
        type: boolean
        description: |
          This is a test mode flag for performing basic functional tests. If this flag is set to 'true' then this will be processed and Out bound messages will be created but the messages will not be delivered to a handset.
      pause_before_transmit:
        type: boolean
        description: |
          This is a flag that tells SCG to generate the messages but not to deliver them.
      pause_expiry_time:
        type: string
        description: |
          This is the timestamp after which all paused messages will expire and will be removed from the outbound queue. The maximum expiry time is 24h. If application creates a message request with Integer pause expiry time, the message request will fail
      price_threshold:
        type: integer
        description: |
          The price threshold for messages in a request
      contact_delivery_address_priority:
        type: array
        items:
          type: string
      scheduled:
        type: boolean
        description: |
          The message is scheduled: true or false
      failover:
        type: string
        description: "Controls fail over to SMS in case of MMS, RCS and OTT message delivery failures. \nValid value: SMS\n"
      failure_code:
        type: string
        description: |
          The failure code associated with this call if applicable.
            failure_details:
      failure_details:
        type: string
        description: |
          The failure message associated with this call if applicable.
      failover_reference:
        type: string
        description: |
          The failover info
      src_language:
        type: string
        description: |
          This is the source language of a message. The defauly is English 'en'
      dst_language:
        type: string
        description: |
          Translate message to a specified language. If not set,  only messages to contacts with language preference will be translated.
      translate:
        type: boolean
        description: |
          When translate attribute is set to 'true' translation of message body is enabled.
      translations_count:
        type: integer
        description: |
          Number of messages being successfully translated
      translations_failed_count:
