      message_templates:
        type: array
        items:
          type: string
      country:
        type: string
        description: |
          The country that the sender address can be used to send messages to. This field will contain ISO country code. The value is managed by Syniverse and not editable by the customer.
      credentials:
        type: string
        description: |
          An array of  inline JSON objects with a list of name, value pairs that contain the credential and configuration values need to use this sender ID.  There is one object in the array per message delivery provider that will be used for delivery messages with this sender ID.  For example, the array may contain one entry for APN and one entry for GCN.
      consent_managed_by:
        type: string
        description: |
          Possible values: USER, SCG or SCG_UNSOLICITED_OPT_OUT. Default is USER
      capabilities:
        type: array
        items:
          type: string
      check_white_list:
        type: boolean
        description: |
          If set, sending via this sender ID is limited to recipients present in the customer's white list.
      application_id:
        type: integer
        description: |
          ID of the application that has created the resource
      company_id:
        type: integer
        description: |
          ID of the company that has created the resource
      created_date:
        type: string
        description: |
          The date the resource was created
      last_updated_date:
        type: string
