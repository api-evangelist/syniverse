  /'messaging/channels/{Channel_ID}/sender_ids':
    get:
      tags:
      - Channel
      summary: List Sender IDs associated with a Channel
      description: '  List Sender IDs associated with a Channel'
      parameters:
      - name: Channel_ID
        in: path
        description: The Channel ID for this resource.
        required: true
        schema:
          type: string
      - name: id
        in: query
        description: 'unique id of the sender address

          '
        required: false
        schema:
          type: string
      - name: parent_id
        in: query
        description: 'for shared short codes, this is a reference to the system  sender id that is associated with this preprovisioned address.  Whenever a customer wants to use a preprovisioned, shared code, the parent sender address id will indicate the sender id that was used to create customer version of the sender id

          '
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: 'name of the sender address

          '
        required: false
        schema:
          type: string
      - name: ownership
        in: query
        description: 'this field determines the ownership category of a shortcode. Applies only for SMS type of sender id''s. Following values are allowed:

          - PRIVATE -> represents a short code that is private for use by one company only

          - SHARED -> represents a short code that is owned by Syniverse and where multiple customers can use it. When a customer wants to use a SHARED sender id, a new PRIVATE sender address will be created with parent sender id set to the SHARED sender id

          - PREPROVISIONED -> represents an address that is owned by Syniverse and can be selected by a customer. Upon a customer selecting a preprovisioned sender address, new sender id document as a copy of the PREPROVISIONED document is created, with state PRIVATE and parent_id pointing the original PREPROVISIONED sender address. The PREPROVISIONED sender address changes ownership to PURCHASED. Once the PRIVATE sender address, pointing to the PURCHASED is deleted, the PURCHASED sender changes its ownership back to PREPROVISIONED.

          - PURCHASED -> PREPROVISIONED sender address, currently occupied by a customer.

          '
        required: false
        schema:
          type: string
      - name: class_id
        in: query
        description: 'reference to the sender address class that determines the priority and throughput of the configured sender id

          '
        required: false
        schema:
          type: string
      - name: type_id
        in: query
        description: 'reference the sender address type that determines the data types allowed on the sender id and identifies the gateway used to deliver the messages

          '
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: 'represents the sender address status. Following values are allowed:

          - PENDING_IMPLEMENTATION

          - IMPLEMENTED

          - ACTIVE

          - INACTIVE

          - BROKEN

          - PENDING_DELETE

          - PENDING_CONFIRMATION


          For each sender address that require provisioning, when a sender address is requested, the initial status will be ''pending implementation''

          '
        required: false
        schema:
          type: string
      - name: country
        in: query
        description: 'The country that the sender address can be used to send messages to. This field will contain ISO country code. The value is managed by Syniverse and not editable by the customer.

          '
        required: false
        schema:
          type: string
      - name: consent_managed_by
        in: query
        description: 'Possible values: USER, SCG or SCG_UNSOLICITED_OPT_OUT. Default is USER

          '
        required: false
        schema:
          type: string
      - name: capabilities
        in: query
        description: 'Message types allowed on the sender ids from of this type: SMS, MMS, VOICE, WhatsApp etc.

          '
        required: false
        schema:
          type: string
      - name: check_white_list
        in: query
        description: 'If set, sending via this sender ID is limited to recipients present in the customer''s white list.

          '
        required: false
        schema:
          type: boolean
      - name: application_id
        in: query
        description: 'ID of the application that has created the resource

          '
        required: false
        schema:
          type: integer
      - name: created_date
        in: query
        description: 'The date the resource was created

          '
        required: false
        schema:
          type: string
      - name: last_updated_date
        in: query
        description: 'for shared short codes, this is a reference to the system  sender id that is associated with this preprovisioned address.  Whenever a customer wants to use a preprovisioned, shared code, the parent sender address id will indicate the sender id that was us

          '
        required: false
        schema:
          type: string
