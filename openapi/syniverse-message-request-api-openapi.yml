  /'messaging/message_requests/{MessageRequest_ID}/messages':
    get:
      tags:
      - Message Request
      summary: Retrieve messages using a Message request Id
      description: '  Retrieve messages using a Message request Id'
      parameters:
      - name: MessageRequest_ID
        in: path
        description: The MessageRequest ID for this resource.
        required: true
        schema:
          type: string
      - name: id
        in: query
        description: 'Unique identifier

          '
        required: false
        schema:
          type: string
      - name: message_request_id
        in: query
        description: 'The unique id of the associated message request resource.

          '
        required: false
        schema:
          type: string
      - name: external_transaction_ids
        in: query
        description: 'This is list of id-s (one for every fragment) issued for this message by the downstream messaging system.

          '
        required: false
        schema:
          type: string
      - name: direction
        in: query
        description: 'Message direction: MO for received messages and MT sent messages

          '
        required: false
        schema:
          type: string
      - name: from_address
        in: query
        description: 'The sender address.

          '
        required: false
        schema:
          type: string
      - name: to_address
        in: query
        description: 'The recipient address.

          '
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: "The status of the message to this recipient.  \nValid values for MT messages are:\n- CREATED (message was created and is in the queue of SCG)\n- SENT (message was sent to the outbound delivery system)\n- DELIVERED (message was delivered to end-device of the user)\n- READ (message was read by the user)\n- CONVERTED (message was converted i.e. end user took action upon message)\n- FAILED (message delivery failed)\n- EXPIRED (message was too old to be sent)\n- SCHEDULED (message is created but not submitted for sending)\n- TEST (message was created but the request was a test request)\n- PAUSED (message was created but the request was to pause before delivery)\n- DELETED \nSCG will automatically set the status of the message to converted when the message contains a 'tracked' URL and the link was clicked by the recipient.\nAlternatively the customer also externally can track conversion and could update the message status put applying the PUT method and specifying status = CONVERTED and the conversion timestamp\nValid values for MO Messages are:\n- RECEIVED (received at SCG)\n- PROCESSED (when the customer has accessed the message and updated the status)\n- DELETED (when the message was deleted by the customer)\n"
        required: false
        schema:
          type: string
      - name: sent_date
        in: query
        description: 'The timestamp when the message was submitted to downstream system for delivery

          '
        required: false
        schema:
          type: string
      - name: delivered_date
        in: query
        description: 'The timestamp when the message has been delivered, corresponds to DR date.

          '
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: 'The message type (SMS, MMS, PSH, FB)

          '
        required: false
        schema:
          type: string
      - name: created_date
        in: query
        description: 'The timestamp when the message was created, which corresponds to the time when the bulk message POST was done by the client.

          '
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: "The from attribute is the channel Id or Sender Id over/from which the message is to be sent.\n-To send from a sender ID, the ID should be prefixed with 'sender_id:'.   \n-To send from a channel the ID should be prefixed with 'channel:'.\n"
        required: false
        schema:
          type: string
      - name: pause_before_transmit
        in: query
        description: 'This is a flag that tells SCG to generate the messages but not to deliver them.

          '
        required: false
        schema:
          type: boolean
      - name: pause_expiry_time
        in: query
        description: 'This is the timestamp after which all paused messages will expire and will be removed from the outbound queue. The maximum expiry time is 24h. If application creates a message request with Integer pause expiry time, the message request will fail

          '
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: 'Recipient address or contact id.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_6'
        '400':
          description: "Bad Request.  The request could not be understood by the server.\n\n  * **400** - Bad Request - Error Message provides information about what's wrong with the request\n  * **1012** - Error message contains details about the limit being exceeded - Message size exceeds system limit\n  * **1023** - Indexed field too long - One of the values in the request exceeded the maximum allowed length\n  * **1020** - Invalid Tracking URL - The tracking URL that was provided is invalid\n  * **SCG_ERROR_4001** - Required parameter<parameter> missing or is null\n  * **SCG_ERROR_4002** - Required parameter <parameter> data type/format is incorrect\n  * **SCG_ERROR_4003** - Optional parameter <parameter> data type/format is incorrect            \n  * **SCG_ERROR_4004** - Invalid parameter <parameter> defined            \n  * **SCG_ERROR_4005** - Error message contains details about the limit being exceeded - Message size exceeds system limit            \n  * **SCG_ERROR_4006** -  Indexed parameter <parameter> too long - Value of <parameter> in the request exceeded the maximum allowed length          \n  * **SCG_ERROR_4007** -  Invalid Tracking URL - The tracking URL <parameter> that was provided is invalid          \n  * **SCG_ERROR_4008** -  Message scheduled time exceeds max allowed days: <parameter>          \n  * **SCG_ERROR_4009** -  Cannot exceed more than <parameter> media URLs                    \n  * **SCG_ERROR_40010**  -  Cannot include media URLs with attachment        \n  * **SCG_ERROR_40011**  -  Group message only supported for US Phone numbers        \n  * **SCG_ERROR_40012**  -  No sender addresses capable of sending requested message type        \n  * **SCG_ERROR_40013**  -  No sender addresses capable of sending requested verifiedSms message      \n  * **SCG_ERROR_40014**  -  Cannot failover to SMS on a message with attachments        \n  * **SCG_ERROR_40015**  - Cannot exceed more than <parameter> recipients          \n  * **SCG_ERROR_40016**  -  Sender id is not capable of sending MMS        \n  * **SCG_ERROR_40017**  -  Only sender id with type id LONGCODE is supported for group MMS        \n  * **SCG_ERROR_40018**  -  Invalid senderId/address: <parameter>        \n  * **SCG_ERROR_40019**  -  Multiple sender id with address: <parameter>. Use sender id to send message.        \n  * **SCG_ERROR_40020**  -  Unrecognized option(s): <parameter>        \n  * **SCG_ERROR_40021**  -  Failover to SMS requires a SenderId for SMS (use a channel)        \n  * **SCG_ERROR_40022**  -  Failover TO SMS requires a SenderId for <parameter> (use a channel)        \n  * **SCG_ERROR_40023**  -  Delivery Window Restriction Violation        \n  * **SCG_ERROR_40024**  -  Invalid Recipient        \n  * **SCG_ERROR_40025**  -  Invalid payload        \n  * **SCG_ERROR_40026**  -  Missing form-data part: <part>        \n  * **SCG_ERROR_40027**  -  Content size in Content-Disposition is mandatory        \n  * **SCG_ERROR_40028**  -  Content length is mandatory        \n  * **SCG_ERROR_40029**  -  Attachment size <parameter> exceeds max allowed attachment size <parameter>        \n  * **SCG_ERROR_40030**  - Only UPLOADED attachments can be downloaded.              \n"
