openapi: 3.2.0
info:
  description: Synivere Communication Gateway API
  version: 1.0.0
  title: SCG Message Request API
servers:
- url: https://api.syniverse.com/scg-external-api/api/v1
tags:
- name: Message Request
paths:
  /messaging/message_requests/:
    get:
      tags:
      - Message Request
      summary: Retrieve all message requests
      description: '  Retrieve all message requests'
      parameters:
      - name: id
        in: query
        description: 'The unique identifier for the message request

          '
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: "The from attribute is the channel Id or Sender Id over/from which the message is to be sent.\n-To= send from a sender ID, the ID should be prefixed with 'sender_id:'.   \n-To send from a channel the ID should be prefixed with 'channel:'.\n example: channel:1KJPMkuHQkair_o15etpmg"
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: 'For MT messages this will be a list of one or more recipient addresses, contact ids, contact group ids

          example

          '
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: 'The status of the message request:

          - SUBMITTED

          - ACCEPTED

          - REJECTED

          - PREPARING (while in the preparing state, the recipient cont may increase with time i.e. SCG will keep track of the preparing step to allow polling on the resource to have user see progress)

          - TRANSMITTING (while in the transmission state, the sent count will be updates as the messages are being sent)

          - COMPLETED

          - PAUSED (SCG will go into this state after preparing if pause flag is set)

          - CANCELED  (cancel can be requested at any time)

          NOTE: to resume paused messages, the status should be updated by customer from PAUSED to TRANSMITTING

          '
        required: false
        schema:
          type: string
      - name: test_message_flag
        in: query
        description: 'This is a test mode flag for performing basic functional tests. If this flag is set to ''true'' then this will be processed and Out bound messages will be created but the messages will not be delivered to a handset.

          '
        required: false
        schema:
          type: boolean
      - name: pause_before_transmit
        in: query
        description: 'This is a flag that tells SCG to generate the messages but not to deliver them.

          '
        required: false
        schema:
          type: boolean
      - name: pause_expiry_time
        in: query
        description: 'This is the timestamp after which all paused messages will expire and will be removed from the outbound queue. The maximum expiry time is 24h. If application creates a message request with Integer pause expiry time, the message request will fail

          '
        required: false
        schema:
          type: string
      - name: created_date
        in: query
        description: 'For a MT sent via this API, this indicates the time when the API was called to request message delivery.  For a MO message, this is the point in time when the SCG was notified of the inbound message from the operator network/mediate channel.

          '
        required: false
        schema:
          type: string
      - name: sent_date
        in: query
        description: "The timestamp when the message was submitted to downstream system for delivery.\nExample: \"2023-05-24T23:24:37.464Z\"  \n"
        required: false
        schema:
          type: string
          pattern: yyyy-mm-dd'T'HH:mm:ss.SSS'Z'
      - name: delivered_date
        in: query
        description: 'The timestamp when the message has been delivered, corresponds to DR date.

          Example: "2023-05-24T23:24:37.464Z"

          '
        required: false
        schema:
          type: string
          pattern: yyyy-mm-dd'T'HH:mm:ss.SSS'Z'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200_5'
        '400':
          description: "Bad Request.  The request could not be understood by the server. \n  * **400** - Bad Request - Error Message provides information about what's wrong with the request \n  * **1012** - Error message contains details about the limit being exceeded - Message size exceeds system limit \n  * **1023** - Indexed field too long - One of the values in the request exceeded the maximum allowed length   \n  * **1020** - Invalid Tracking URL - The tracking URL that was provided is invalid \n  * **4001** - Required parameter<parameter> missing or is null \n  * **4002** - Required parameter <parameter> data type/format is incorrect \n  * **4003** - Optional parameter <parameter> data type/format is incorrect\n  * **4004** - Invalid parameter <parameter> defined \n  * **4005** - Error message contains details about the limit being exceeded - Message size exceeds system limit\n  * **4006** - Indexed parameter <parameter> too long - Value of <parameter> in the request exceeded the maximum allowed length\n  * **4007** - Invalid Tracking URL - The tracking URL <parameter> that was provided is invalid\n  * **4008** - Message scheduled time exceeds max allowed days: <parameter>\n  * **4009** - Cannot exceed more than <parameter> media URLs\n  * **40010** - Cannot include media URLs with attachment\n  * **40011** - Group message only supported for US Phone numbers\n  * **40012** - No sender addresses capable of sending requested message type\n  * **40013** - No sender addresses capable of sending requested verifiedSms message\n  * **40014** - Cannot failover to SMS on a message with attachments\n  * **40015** - Cannot exceed more than <parameter> recipients\n  * **40016** - Sender id is not capable of sending MMS\n  * **40017** - Only sender id with type id LONGCODE is supported for group MMS\n  * **40018** - Invalid senderId/address: <parameter>\n  * **40019** - Multiple sender id with address: <parameter>. Use sender id to send message.\n  * **40020** - Unrecognized option(s): <parameter>\n  * **40021** - Failover to SMS requires a SenderId for SMS (use a channel)\n  * **40022** - Failover TO SMS requires a SenderId for <parameter> (use a channel)\n  * **40023** - Delivery Window Restriction Violation\n  * **40024** - Invalid Recipient \n  * **40025** - Invalid payload\n  * **40026** - Missing form-data part: <part>\n  * **40027** - Content size in Content-Disposition is mandatory\n  * **40028** - Content length is mandatory\n  * **40029** - Attachment size <parameter> exceeds max allowed attachment size <parameter>\n  * **40030** - Only UPLOADED attachments can be downloaded.\n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '401':
          description: "Unauthorized. The request requires user authentication.\n\n  * **401** - Unauthorized - Provided authentication data is invalid or insufficient\n  * **4010** - Token unauthorized for this resource\n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '402':
          description: "Payment Required.\n\n  * **402** - Insufficient credit - The account does not have sufficient funds for this operation\n  * **4021** - Quota exceeded\n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '403':
          description: "Forbidden. The user does not have permission to access the specified resource. \n * **403** - Forbidden - Access to this resource is not allowed with the current application token \n * **4030** - Forbidden \n * **4031** - Attachment <parameter> was not found neither in cache nor in database \n * **4032** - Attachment <parameter> is in incorrect state <parameter> \n * **4033** - SenderId start date in the future: <parameter> \n * **4034** - SenderId end date in the past: <parameter> \n * **4035** - Invalid sender ID state: <parameter> \n * **4036** - Invalid sender ID ownership: <parameter> \n * **4037** - <parameter> forbidden for attachment in state: <parameter>\n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '404':
          description: "Not found. The requested resource could not be found. \n * **404** - Error message contains details about the missing resource - Requested resource not found \n * **4040** - Resource you are trying to fetch not found for <parameter> \n * **4041** - Resource you are trying to update cannot be found for <parameter> \n * **4042** - No mdn is found \n * **4043** - The language code <language> is not found among the languages supported by Google Translate \n * **4044** - Non-shortcode senderId is found. \n * **4045** - No sender id matches with recipient country. \n * **4046** - Access token expired \n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '409':
          description: "Conflict. The request could not be completed due to a conflict with the current state of the target resource.\n\n  * **1001** - Stale data - Concurrent resource update. Refresh the resource and retry.\n  * **1011** - Error message contains details about the key being violated - Unique key constraint violated\n  * **4090** - The access token could not be updated because resource is being updated\n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '422':
          description: "Unprocessable Entity\n  * **4220** - Attachment content could not be downloaded from the provided URL. The error message is <error message>\n"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
        '500':
          description: "Server Error. An error has been encountered while processing this request. \n * **500** - Server Error - Internal server error. Please report \n * **5000** - Unexpected Server Error \n * **5001** - Unexpected Non Retriable Server Error \n * **5002** - Message type restriction not implemented for: <messageType> \n * **5003** - Error redirecting to proxy: <parameter> \n * **5004** - Error downloading attachment from storage: <parameter>"
          content:
            application/json:
              schema:
                properties:
                  error_code:
                    type: string
                    description: The error code for this error.
                  error_description:
                    type: string
                    description: A human readable description of the error.
