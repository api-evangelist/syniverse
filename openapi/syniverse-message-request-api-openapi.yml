components:
  schemas:
    Message_Request:
      type: object
      properties:
        from:
          type: string
          example: channel:1KJPMkuHQkair_o15etpmg
          description: "The from attribute is the channel Id or Sender Id over/from which the message is to be sent.\n-To send from a sender ID, the ID should be prefixed with 'sender_id:'.   \n-To send from a channel the ID should be prefixed with 'channel:'.\n"
        to:
          type: array
          example: 13467871829
          description: 'For MT messages this will be a list of one or more recipient addresses, contact ids, contact group ids

            '
          items:
            type: string
        body:
          type: string
          description: 'This is the body of the message as supplied by the customer''s application.  It can reference a message template and supply the variables assignments for use with a template or contain the actual message body

            '
        attachments:
          type: array
          description: 'A list of attachment IDs which are associated with this message.

            '
          items:
            type: string
        media_urls:
          type: array
          description: 'A list of publicly accessible URLs that point to media files.  The media files will be used as attachments to the message.

            '
          items:
            type: string
        subject:
          type: string
          description: 'The subject - a short summary of the message''s purpose.

            '
        application_id:
          type: string
          description: 'ID of the application that has created the message request

            '
        external_id:
          type: string
          description: 'Application provided unique tracking ID for the message.   Can be used as an alternative key in query methods.

            '
        consent_requirement:
          type: string
          description: 'This field indicates if the message delivery is dependent on the consent status for the message recipient. This field is specific to a Sender address (Shortcode) that is classified as ''User Managed'' consent.  This is meant for Businesses who are responsible for managing consent but use the SCG contacts database to store the consent status for message recipients. Any contacts/destination MDNs for end-users that a message is sent to but does not have an opt-in status associated with the sender address will be blocked (message will be created but will be in ''failed'' status and will not be sent to the recipient).  Supported values are:

            - OPT_IN (message will be sent only if user explicitly opted in)

            - OPT_OUT (message will be sent unless user explicitly opted out)

            - NONE (message will be sent irrespectively of optin status)

            '
        criteria:
          type: string
          description: 'The criteria string which was used in the bulk transmission, if any.

            '
        verify_number:
          type: boolean
          description: 'If this flag is set to ''true'' then the recipient phone numbers will be checked to ensure they are valid mobile numbers,  virtual mobile numbers or virtual landline numbers.

            '
        recipient_ count:
          type: integer
          description: 'The number of contacts satisfying the criteria (or in the contact group) who have an address on the channel the bulk message is targeted for.

            '
        sent_count:
          type: integer
          description: 'The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.

            '
        delivered_count:
          type: integer
          description: 'The number of messages sent for which some form of delivery receipt confirmation has been received. The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.

            '
        read_count:
          type: integer
          description: 'The number of messages sent for which some form of delivery receipt confirmation has been received. The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.

            '
        converted_count:
          type: integer
          description: 'The number of messages where conversion has been confirmed. This will apply for messages with URL where the application requested a link track. The number of messages successfully sent via API to the underlying channel. The counts are increased continuously as additional messages satisfy criteria.

            '
        canceled_count:
          type: integer
          description: 'The number of messages that have been created but not sent because the message request was canceled

            '
        failover:
          type: string
          description: "Controls fail over to SMS in case of MMS, RCS and OTT message delivery failures. \nValid value: SMS\n"
        src_language:
          type: string
          description: 'This is the source language of a message. The defauly is English ''en''

            '
        dst_language:
          type: string
          description: 'Translate message to a specified language. If not set,  only messages to contacts with language preference will be translated.

            '
        translate:
          type: boolean
          description: 'When translate attribute is set to ''true'' translation of message body is enabled.

            '
        content_type:
          type: string
          description: 'The content type of the message request body.

            '
        options:
          $ref: '#/components/schemas/Message_Request_options'
        body_extensions:
          type: array
          description: 'Extended body

            '
          items:
            $ref: '#/components/schemas/Message_Request_body_extensions'
        expiry_time:
          type: string
          example: 2023-07-31T15:50:00 or 2023-07-31 or Mon, 07 Aug 2023 11:54:28 UTC or 1690793596000
          description: 'Date when the message would be expired, to be passed in epoch format.

            '
        scheduled_delivery_time:
          type: string
          example: '1690419562110'
          description: 'Date when the message to be scheduled, to be passed in epoch format.

            '
        scheduled_delivery_time_zone:
          type: string
          example: LOCAL
          description: 'Date when the message to be scheduled for specific timezone.

            '
        contact_delivery_address_priority:
          type: string
          example: WHATSAPP,MDN
          description: 'Priority list of contact delivery addresses (MDN, PUSH)

            '
    inline_response_200_3:
      type: object
      properties:
        id:
          type: string
          description: The identifier for the newly created resource.
    Message_Request_body_extensions:
      type: object
      properties:
        type:
          example: DEEP_LINK
        content:
          example: https://www.syniverse.com/
    Message_Request_options:
      type: object
      properties:
        push:badge:
          type: string
          example: auto
        push:notify_type:
          type: string
          example: silent
        push:sound:
          type: string
          example: default
      description: 'json options in use with push notifications.

        '
    inline_response_200_6:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/inline_response_200_6_list'
    inline_response_200_6_list:
      type: object
      properties:
        id:
          type: string
          description: 'Unique identifier

            '
        message_request_id:
          type: string
          description: 'The unique id of the associated message request resource.

            '
        external_message_request_id:
          type: string
          description: 'Application provided unique tracking ID for the message.   Can be used as an alternative key in query methods.

            '
        conversation_id:
          type: string
          description: 'The identifier of the conversation for conversation threading.

            '
        campaign_id:
          type: string
          description: 'The campaign id: A unique identifier for a particular messaging campaign or program

            '
        direction:
          type: string
          description: 'Message direction: MO for received messages and MT sent messages

            '
        customer_sender_id:
          type: string
          description: 'The sender_id associated with the message delivery channel. For MT messages this will be the sender_id used to deliver the message. For MO messages this will be the sender_id corresponding to the downstream system which generated the message (determined by SCG based on the from/to address accordingly)

            '
        from_address:
          type: string
          description: 'The sender address.

            '
        to_address:
          type: string
          description: 'The recipient address.

            '
        state:
          type: string
          description: "The status of the message to this recipient.  \nValid values for MT messages are:\n- CREATED (message was created and is in the queue of SCG)\n- SENT (message was sent to the outbound delivery system)\n- DELIVERED (message was delivered to end-device of the user)\n- READ (message was read by the user)\n- CONVERTED (message was converted i.e. end user took action upon message)\n- FAILED (message delivery failed)\n- EXPIRED (message was too old to be sent)\n- SCHEDULED (message is created but not submitted for sending)\n- TEST (message was created but the request was a test request)\n- PAUSED (message was created but the request was to pause before delivery)\n- DELETED \nSCG will automatically set the status of the message to converted when the message contains a 'tracked' URL and the link was clicked by the recipient.\nAlternatively the customer also externally can track conversion and could update the message status put applying the PUT method and specifying status = CONVERTED and the conversion timestamp\nValid values for MO Messages are:\n- RECEIVED (received at SCG)\n- PROCESSED (when the customer has accessed the message and updated the status)\n- DELETED (when the message was deleted by the customer)\n"
        failure_code:
          type: string
          description: 'INVALID_RECIPIENT, NO_CONSENT, OTHER

            '
        failure_details:
          type: string
          description: 'text description that gives more detail on failed messages

            '
        subject:
          type: string
          description: 'Subject of the message.

            '
        body:
          type: string
          description: 'The message body as sent to the recipient.

            '
        sent_date:
          type: string
          description: 'The timestamp when the message was submitted to downstream system for delivery

            '
        delivered_date:
          type: string
          description: 'The timestamp when the message has been delivered, corresponds to DR date.

            '
        converted_date:
          type: string
          description: 'The timestamp when the message was converted. This will be set automatically by SCG for messages with link tracking. For external tracking, the customer must provide the converted timestamp

            '
        reply_to:
          type: string
          description: 'The Message ID of a previously delivered message which the current message is a reply to.

            '
        attachments:
          type: array
          items:
            type: string
        scheduled_delivery_time:
          type: string
          description: 'The date and time that this message should be delivered. This is the user specific time as calculated by the SCG based on the destination time zone and requested time zone calculation.

            '
        expiry_time:
          type: string
          description: 'This is the timestamp after which the messages will no Integer be sent to the downstream system for delivery

            '
        type:
          type: string
          description: 'The message type (SMS, MMS, PSH, FB)

            '
        contact_id:
          type: string
          description: 'The ID of the contact (if any) this message was sent to

            '
        price:
          type: number
          description: 'The message cost.

            '
        application_id:
          type: integer
          description: 'ID of the application that has created the resource

            '
        created_date:
          type: string
          description: 'The timestamp when the message was created, which corresponds to the time when the bulk message POST was done by the client.

            '
        language:
          type: string
          description: 'Language this message was translated to

            '
        failedTranslation:
          type: string
