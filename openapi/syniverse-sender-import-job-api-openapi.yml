          type: string
          description: 'attachment with csv data

            '
        receipts_attachment_id:
          type: string
          description: 'attachment with additional info

            '
        address_type:
          type: string
          description: 'Default Address type

            '
        capabilities:
          type: string
          description: 'default capabilities

            '
        country:
          type: string
          description: 'default country

            '
