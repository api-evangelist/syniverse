          type: string
          description: "tollfree billing info\n  state:\n"
        state:
          type: string
          description: 'The job state: CREATED, RUNNING, COMPLETED, FAILED, RESUMED, WAIT;

            '
        started_date:
          type: string
          description: 'The job started date

            '
        last_started_date:
          type: string
          description: 'The job last started date

            '
        completed_date:
          type: string
          description: 'The job completed date

            '
        resumed_count:
          type: integer
          description: 'The job resumed count

            '
        failure_details:
          type: string
          description: 'text description that gives more detail on failed messages

            '
        failures_attachment_id:
          type: string
          description: 'failures attachment id

            '
        register_failures_attachment_id:
          type: string
          description: 'register failures attachment id

            '
        imported_count:
          type: integer
          description: 'imported sender ids count

            '
        registered_count:
          type: integer
          description: 'registered sender ids count

            '
        failed_registered_count:
          type: integer
          description: 'failed to registed sender ids count

            '
        approval_state:
          type: string
          description: 'sender ids import approval state (WAITING, APPROVED, REJECTED, AUTO)

            '
        bulk_permission:
          type: string
          description: 'bulk permission

            '
        batch_size_limit:
          type: integer
          description: 'batch size limit

            '
        ownership:
          type: string
          description: 'this field determines the ownership category of a shortcode. Applies only for SMS type of sender id''s. Following values are allowed:

            - PRIVATE -> represents a short code that is private for use by one company only

            - SHARED -> represents a short code that is owned by Syniverse and where multiple customers can use it. When a customer wants to use a SHARED sender id, a new PRIVATE sender address will be created with parent sender id set to the SHARED sender id

            - PREPROVISIONED -> represents an address that is owned by Syniverse and can be selected by a customer. Upon a customer selecting a preprovisioned sender address, new sender id document as a copy of the PREPROVISIONED document is created, with state PRIVATE and parent_id pointing the original PREPROVISIONED sender address. The PREPROVISIONED sender address changes ownership to PURCHASED. Once the PRIVATE sender address, pointing to the PURCHASED is deleted, the PURCHASED sender changes its ownership back to PREPROVISIONED.

            - PURCHASED -> PREPROVISIONED sender address, currently occupied by a customer.

            '
        register_state:
          type: string
          description: 'The job state (CREATED, RUNNING, COMPLETED, FAILED, RESUMED, WAIT;)

            '
        register_provider:
          type: string
          description: 'register provider (NETNUMBERS, NONE, ZIPWHIP)

            '
        charges:
          type: string
          description: 'sender id fee type (PROCESSING, SETUP, INITIAL, RECURRING, CONSENT_INITIAL, CONSENT_RECURRING, IMPLEMENTATION)

            '
        application_id:
          type: integer
          description: 'ID of the application that has created the resource

            '
        created_date:
          type: string
          description: 'The date the resource was created

            '
        last_updated_date:
          type: string
          description: 'The data the resource was last changed

            '
        version_number:
          type: integer
          description: An ascending version number of the resource.  1 upon creation, incremented by one for each modification done.  Used to implement optimistic locking
